microserve:
  worker_processes: auto
  error_log: microserve.log
  error_log_level: debug #trace, debug, info, warn, error, crit
  pid: microserve.pid
  default_type: application/octet-stream
  log_dir: ../logs

timeouts:
  connect: 5
  read: 10
  write: 10

# Named upstreams. Locations reference these by name (endpoint-agnostic).
# Each child only receives backends it actually uses.
backends:
  - name: terminus1
    servers:
      - 127.0.0.1:9191
  - name: terminus2
    servers:
      - 127.0.0.1:9292

servers:
  # Public site: one child, multiple protocols / ports.
  - server_name: localhost
    listen:
      - bind: 9090
        protocol: ["http11", "http2c"]
      - bind: 9443
        protocol: ["http2", "http3"]
    tls_cert: certs/server.crt
    tls_key: certs/server.key
    indexes:
      - index.html
      - index.htm
    locations:
      - path: /
        root: ../public
      - path: /secret
        root: ../private
        auth: basic
        auth_realm: secret space
        auth_file: ../.htpasswd
      - path: /terminus
        proxy_pass: backend://terminus2/  # terminus2 = h2c backend
#        proxy_pass: backend://terminus1/
#        proxy_pass: http://127.0.0.1:9191/
      - path: /terminus.old
        proxy_pass: backend://terminus1/
    access_log: localhost.access.log
    access_log_format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer"'

  # Isolated internal site: separate child, loopback only (not expanded by --ipv6).
  - server_name: terminus
    listen:
      - bind: 127.0.0.1:9191
        protocol: http11
      - bind: 127.0.0.1:9292
        protocol: http2c      # cleartext HTTP/2 (h2c) only
    indexes:
      - index.html
    locations:
      - path: /
        root: ../private
    access_log: terminus.access.log
    access_log_format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer"'
